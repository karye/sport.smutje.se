# sport.smutje.se — port 443
#
# Skapas för hand, inte av `certbot --apache`. Skälet: certbot plugin skriver om vhosten vid varje
# förnyelse, och då kan säkerhetsrubrikerna och proxyinställningarna tyst försvinna. Certifikatet
# utfärdas i stället med `certbot certonly --webroot` (se deploy/README.md), och den här filen ägs
# av oss.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName sport.smutje.se

    # ACME-sökvägen ska svara med filen även över https. Let's Encrypt validerar över port 80,
    # men en människa som provar förnyelsen ska inte få appens inloggningssida tillbaka.
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPreserveHost On
    ProxyTimeout 120
    ProxyPass / http://127.0.0.1:3011/
    ProxyPassReverse / http://127.0.0.1:3011/

    RequestHeader set X-Forwarded-Proto "https"

    # Säkerhetsrubriker, avsnitt 14 i README.
    # 'unsafe-inline' i style-src behövs för serverns egna sidor, som har sin CSS i <style>.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    ErrorLog ${APACHE_LOG_DIR}/sport.smutje.se-error.log
    CustomLog ${APACHE_LOG_DIR}/sport.smutje.se-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/sport.smutje.se/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sport.smutje.se/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
