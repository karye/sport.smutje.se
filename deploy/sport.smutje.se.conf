# sport.smutje.se — port 80

<VirtualHost *:80>
    ServerName sport.smutje.se

    # ACME-utmaningen måste nå fram utan proxy. Utan raderna nedan proxas den till appen, som
    # svarar med appskalet i HTML, och då kan certifikatet varken utfärdas eller förnyas.
    # ProxyPass-regeln med '!' måste stå före ProxyPass / för att vinna.
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPreserveHost On
    ProxyTimeout 120
    ProxyPass / http://127.0.0.1:3011/
    ProxyPassReverse / http://127.0.0.1:3011/

    # Gör att appen vet att anropet kom in över HTTPS. Huvudet sätts i 80-filen och inte i
    # -le-ssl.conf, så att det överlever en ny certbot-körning.
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/sport.smutje.se-error.log
    CustomLog ${APACHE_LOG_DIR}/sport.smutje.se-access.log combined

    RewriteEngine on
    # ACME-utmaningen får aldrig omdirigeras till https: certifikatet finns inte ännu, och då
    # misslyckas valideringen med ett certifikatfel i stället för att bara hämta token.
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{SERVER_NAME} =sport.smutje.se
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
